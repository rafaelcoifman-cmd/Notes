<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add_circle" />    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
        .icon-notes{
            margin: 20px;
            font-size: 60px;
            color: #a9b8ee;
            cursor: crosshair;
        }
        #noteDetails{
            height: 500px;
            width: 400px;
            padding: 10px;
        }
        #noteTitle{
            height: 50px;
            width: 400px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <center id="mainContainer">
        <span class="material-symbols-outlined icon-notes" data-bs-toggle="modal" data-bs-target="#exampleModal">
            add_circle
        </span>
        

        <!-- Modal -->
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Note Details</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <textarea id="noteTitle"></textarea>
                    <textarea id="noteDetails"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button onclick="createCard()" type="button" class="btn btn-primary" data-bs-dismiss="modal">Save changes</button>
                </div>
                </div>
            </div>
        </div>

        <!-- Just for reference we are keeping a html of the card  -->
        <!-- <div class="card text-bg-primary mb-3" style="width: 18rem;">

            <div class="card-body">
                <h5 class="card-title">Card title</h5>
                <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card’s content.</p>
                <span style="background-color: white; color: #0d6efd; padding: 5px; border-radius: 8px;">Edit</span>
                <span style="background-color: white; color: #0d6efd; padding: 5px; border-radius: 8px;">Delete</span>
            </div>

        </div> -->
        
    </center>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script>
    showCards()
    function createCard(){
        var h5 = document.createElement("h5")
        var description = document.createElement("p")
        var textStorage = document.createElement("div") 
        var cardDiv = document.createElement("div") 
        var editSpan = document.createElement("span")
        var deleteSpan = document.createElement("span")
        h5.innerHTML = document.getElementById("noteTitle").value
        description.innerHTML = document.getElementById("noteDetails").value
        h5.setAttribute("class","card-title")
        description.setAttribute("class","card-text")
        editSpan.style.backgroundColor = "white"
        editSpan.style.color = "#0d6efd"
        editSpan.style.padding = "5px"
        editSpan.style.margin = "5px"
        editSpan.style.borderRadius = "8px"
        editSpan.innerHTML = "Edit"
        editSpan.style.cursor = "pointer"
        deleteSpan.style.backgroundColor = "white"
        deleteSpan.style.color = "#0d6efd"
        deleteSpan.style.padding = "5px"
        editSpan.style.margin = "5px"
        deleteSpan.style.borderRadius = "8px"
        deleteSpan.innerHTML = "Delete"
        deleteSpan.style.cursor = "pointer"
        textStorage.appendChild(h5)
        textStorage.appendChild(description)
        textStorage.appendChild(editSpan)
        textStorage.appendChild(deleteSpan)
        textStorage.setAttribute("class","card-body")
        
        cardDiv.appendChild(textStorage)
        cardDiv.setAttribute("class","card text-bg-primary mb-3")
        cardDiv.style.width = "18rem"
        // localStorage.setItem("card",cardDiv )
        var center = document.getElementById("mainContainer")
        center.appendChild(cardDiv)
        //  var stringifiedcard = JSON.stringify[cardDiv]
        // var stringifiedDescrip = JSON.stringify["description",description]
        var notesArray = []
        var objs={title:noteTitle.value , description:noteDetails.value}
        if(localStorage.getItem("Notes")==null){
            notesArray = []
        }
        else{
        var notesArrayString = localStorage.getItem("Notes")
         notesArray = JSON.parse(notesArrayString)
        }
        notesArray.push(objs)
        var newNotesArrayString = JSON.stringify(notesArray)
        localStorage.setItem("Notes", newNotesArrayString)
        //  localStorage.setItem("description",stringifiedDescrip )
        
    }

    function showCards(){
        var gatheredItems= localStorage.getItem("Notes")
        var itemsArray= JSON.parse(gatheredItems)
        console.log(itemsArray)
        for(i=0;i<itemsArray.length;i=i+1){
         var h5 = document.createElement("h5")
        var description = document.createElement("p")
        var textStorage = document.createElement("div") 
        var cardDiv = document.createElement("div") 
        var editSpan = document.createElement("span")
        var deleteSpan = document.createElement("span")
        h5.innerHTML = itemsArray[i]["title"]
        description.innerHTML = itemsArray[i]["description"]
        h5.setAttribute("class","card-title")
        description.setAttribute("class","card-text")
        editSpan.style.backgroundColor = "white"
        editSpan.style.color = "#0d6efd"
        editSpan.style.padding = "5px"
        editSpan.style.margin = "5px"
        editSpan.style.borderRadius = "8px"
        editSpan.innerHTML = "Edit"
        editSpan.style.cursor = "pointer"
        deleteSpan.style.backgroundColor = "white"
        deleteSpan.style.color = "#0d6efd"
        deleteSpan.style.padding = "5px"
        editSpan.style.margin = "5px"
        deleteSpan.style.borderRadius = "8px"
        deleteSpan.innerHTML = "Delete"
        deleteSpan.style.cursor = "pointer"
        textStorage.appendChild(h5)
        textStorage.appendChild(description)
        textStorage.appendChild(editSpan)
        textStorage.appendChild(deleteSpan)
        textStorage.setAttribute("class","card-body")
        cardDiv.appendChild(textStorage)
        cardDiv.setAttribute("class","card text-bg-primary mb-3")
        cardDiv.style.width = "18rem"
        var center = document.getElementById("mainContainer")
        center.appendChild(cardDiv)
    
    }
}

    //     {
    //         "title" : "3rd card title",
    //         "description" : "3rd card description"
    //     }
    // ]
    
</script>
</html>
